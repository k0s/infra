---
- name: Render the service index unit
  become: true
  ansible.builtin.template:
    src: service-index.service.j2
    dest: /etc/systemd/system/service-index.service
    mode: "0644"
  notify: Reload systemd and restart the service index

# On a first dry run the unit does not exist yet, so this fails under --check
# only; a real run renders the unit first.
- name: Enable and start the service index
  become: true
  ansible.builtin.systemd_service:
    name: service-index
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
