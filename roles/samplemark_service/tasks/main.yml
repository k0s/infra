---
# samplemark records the desktop session's audio output (PipeWire), so it runs
# as a user unit in that session: no lingering, and no root anywhere in this
# role.

- name: Check for a running desktop session
  ansible.builtin.stat:
    path: "/run/user/{{ ansible_facts.user_uid }}/bus"
  register: samplemark_service_session

- name: Require a running desktop session (the unit and PipeWire live in it)
  ansible.builtin.assert:
    that: samplemark_service_session.stat.exists
    fail_msg: "No user session on this host; log in at its desktop first"

- name: Check for the samplemark virtualenv
  ansible.builtin.stat:
    path: "{{ samplemark_service_venv }}/bin/samplemark"
  register: samplemark_service_venv_check

# Everything in this block downloads or builds, so it is skipped under --check.
# Install only: an existing checkout or virtualenv is left alone.
- name: Install the samplemark application
  when:
    - not samplemark_service_venv_check.stat.exists
    - not ansible_check_mode
  block:
    - name: Create the uv directory
      ansible.builtin.file:
        path: "{{ samplemark_service_uv_dir }}"
        state: directory
        mode: "0755"

    - name: Download uv (pinned, checksum-verified)
      ansible.builtin.get_url:
        url: "https://github.com/astral-sh/uv/releases/download/{{ samplemark_service_uv_version }}/uv-{{ samplemark_service_uv_target }}.tar.gz"
        dest: "{{ samplemark_service_uv_dir }}/uv.tar.gz"
        checksum: "sha256:{{ samplemark_service_uv_sha256 }}"
        mode: "0644"

    - name: Unpack uv
      ansible.builtin.unarchive:
        src: "{{ samplemark_service_uv_dir }}/uv.tar.gz"
        dest: "{{ samplemark_service_uv_dir }}"
        remote_src: true
        creates: "{{ samplemark_service_uv_dir }}/uv-{{ samplemark_service_uv_target }}/uv"

    - name: Clone samplemark (only if absent)
      ansible.builtin.git:
        repo: "{{ samplemark_service_repo }}"
        dest: "{{ samplemark_service_src }}"
        version: main
        update: false

    - name: Build the virtualenv from uv.lock
      ansible.builtin.command:
        cmd: "{{ samplemark_service_uv_dir }}/uv-{{ samplemark_service_uv_target }}/uv sync --frozen --no-dev"
        chdir: "{{ samplemark_service_src }}"
        creates: "{{ samplemark_service_venv }}/bin/samplemark"
      notify: Restart samplemark

- name: Create the output directory
  ansible.builtin.file:
    path: "{{ samplemark_service_output }}"
    state: directory
    mode: "0755"

- name: Create the user unit directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: Install the samplemark user unit
  ansible.builtin.template:
    src: samplemark.service.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/samplemark.service"
    mode: "0644"
  notify: Restart samplemark

# Skipped in check mode: on a first dry run the unit doesn't exist yet.
- name: Enable and start samplemark
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    scope: user
    name: samplemark
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
