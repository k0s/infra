---
# The Forge install proper; included from main.yml only on hosts whose GNOME
# Shell can load it.

- name: Install Forge build dependencies
  ansible.builtin.apt:
    name: "{{ forge_build_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Check the build tools are on PATH
  ansible.builtin.command: which {{ item }}
  changed_when: false
  loop:
    - git
    - make
    - msgfmt
    - msgmerge
    - xgettext
    - glib-compile-schemas

- name: Check for an existing installed extension
  ansible.builtin.stat:
    path: "{{ forge_ext_dir }}"
  register: forge_existing_ext

- name: Back up the existing installed extension (once)
  ansible.builtin.command:
    cmd: cp -a "{{ forge_ext_dir }}" "{{ forge_ext_dir }}.bak"
    creates: "{{ forge_ext_dir }}.bak"
  when: forge_existing_ext.stat.exists

- name: Clone or update the Forge source
  ansible.builtin.git:
    repo: "{{ forge_repo }}"
    dest: "{{ forge_src }}"
    version: "{{ forge_version }}"
    # po/*.po is the only thing `make build` ever touches in this checkout
    # (confirmed 2026-08-23 via git diff --stat after a real build) — safe
    # to always discard rather than let it block every future run.
    force: true
  register: forge_git

- name: Build Forge
  ansible.builtin.command:
    cmd: make build
    chdir: "{{ forge_src }}"
  when: not ansible_check_mode   # no clone happens under --check

- name: Install Forge into the user extension directory
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ forge_src }}"
  when: not ansible_check_mode   # no clone happens under --check

- name: Read the installed metadata
  ansible.builtin.slurp:
    src: "{{ forge_ext_dir }}/metadata.json"
  register: forge_metadata
  when: not ansible_check_mode or forge_existing_ext.stat.exists

- name: Verify the installed Forge declares GNOME 50 support
  ansible.builtin.assert:
    that:
      - "'50' in (forge_metadata.content | b64decode | from_json)['shell-version']"
    fail_msg: "Installed Forge metadata does not list GNOME Shell 50"
  when: not ansible_check_mode or forge_existing_ext.stat.exists

# Enabling is best-effort, because it depends on GNOME Shell state this role
# cannot control. `gnome-extensions enable` talks to the *running* Shell over
# D-Bus, and reports `Extension "..." does not exist` in two distinct cases:
#   1. no session is running at all (a headless host, or nobody logged in);
#   2. a session IS running but started before this install, so the Shell has
#      not scanned the extension directory yet.
# Neither is a failure of this role -- the files are installed and verified
# above -- so neither should fail the play. Both are fixed by logging in, or
# logging out and back in. Observed 2026-09-07.
- name: Check whether a GNOME Shell session is running for this user
  ansible.builtin.command: pgrep -u {{ ansible_facts.user_id }} -x gnome-shell
  register: forge_session
  changed_when: false
  failed_when: false
  check_mode: false      # read-only probe; must run in --check too, or the
                         # report below cannot tell the two cases apart

- name: Enable the extension (best effort)
  ansible.builtin.command: gnome-extensions enable {{ forge_ext_id }}
  register: forge_enable
  changed_when: false
  failed_when: false

- name: Report whether the extension is enabled
  ansible.builtin.debug:
    msg: >-
      {% if forge_enable.rc | default(1) == 0 %}
      Forge is installed and enabled.
      {% elif forge_session.rc | default(1) != 0 %}
      Forge is INSTALLED BUT NOT ENABLED: no GNOME Shell session is running for
      this user. Log in at the machine; then `gnome-extensions enable
      {{ forge_ext_id }}`, or just re-run this role.
      {% else %}
      Forge is INSTALLED BUT NOT ENABLED: a GNOME Shell session is running, but
      it started before this install, so the Shell has not scanned the extension
      yet. Log out and back in at the machine, then `gnome-extensions enable
      {{ forge_ext_id }}` (or re-run this role).
      {% endif %}

- name: Remind about the shell reload
  ansible.builtin.debug:
    msg: >-
      Forge ({{ forge_git.after | default(forge_version) }}, GNOME 45-50.1) installed. Log out and back in to
      reload GNOME Shell. Rollback: rm -rf {{ forge_ext_dir }} && mv
      {{ forge_ext_dir }}.bak {{ forge_ext_dir }} (or reinstall v89 from
      extensions.gnome.org).
