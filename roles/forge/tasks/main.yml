---
# Install the Forge GNOME extension from git (https://github.com/forge-ext/forge).
#
# Why git and not extensions.gnome.org: as of 2026-07-03 the e.g.o release (v89)
# supports GNOME Shell <= 49 only; git main declares 45-50.1, which the Ubuntu
# 26.04 / GNOME 50 upgrade needs.
#
# Deliberately does NOT run Forge's `make all` — its `restart` target logs you
# out on Wayland. After a run, log out/in manually to reload the shell.
# Rollback: restore the .bak dir created below, or reinstall v89 from e.g.o.
#
# forge_version tracks "main" deliberately, not a pin (see defaults for why).
# `make build` regenerates po/forge.pot from source and runs `msgmerge -U` on
# every po/*.po file (confirmed 2026-08-23 — idempotent once in sync with the
# current source, but any new upstream commit re-dirties them). Since main is
# a moving target by design here, the clone/update task below uses `force`
# rather than trying to avoid the dirt: po/*.po is the *only* thing this
# build process ever touches in this checkout, so discarding local
# modifications before every checkout is safe, not just convenient.

# Forge needs GNOME Shell >= forge_min_shell. Below that (Pop!_OS 22.04 ships
# 42.9 with its own tiler, pop-shell), or with no GNOME Shell at all (a
# headless host, COSMIC), the role skips rather than installing an extension
# the Shell cannot load. Read from the host, so there is no list to maintain.
- name: Read the GNOME Shell version
  ansible.builtin.command: gnome-shell --version
  register: forge_shell_probe
  changed_when: false
  failed_when: false
  check_mode: false      # read-only; the decision below must hold under --check

- name: Decide whether Forge applies to this host
  ansible.builtin.set_fact:
    forge_shell_version: "{{ _version }}"
    forge_applies: "{{ _version | length > 0 and _version is version(forge_min_shell, '>=') }}"
  vars:
    _version: >-
      {{ ((forge_shell_probe.stdout | default('') | regex_findall('GNOME Shell ([0-9.]+)')) + [''])[0] }}

- name: Report why Forge is skipped
  ansible.builtin.debug:
    msg: >-
      Skipping Forge: {{ 'no GNOME Shell found' if not forge_shell_version
      else 'GNOME Shell ' ~ forge_shell_version ~ ' is below ' ~ forge_min_shell }}.
  when: not forge_applies | bool

- name: Install Forge
  ansible.builtin.include_tasks: install.yml
  when: forge_applies | bool
