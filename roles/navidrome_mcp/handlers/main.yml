---
# Skipped in check mode: the unit may not exist yet.
- name: Restart navidrome-mcp
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    scope: user
    name: navidrome-mcp
    state: restarted
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
