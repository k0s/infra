---
# Folder IDs, not full paths — Syncthing folder IDs must match exactly across
# every device sharing them; the local path is always {{ HOME }}/<id> here,
# the same convention on every host in the mesh.
syncthing_folders:
  - movies
  - projects

# Folder type for this host. Syncthing's type is a *per-device* property: the
# same folder is legitimately sendreceive on one machine and receiveonly on
# another, so this is set per host, not per folder-globally. Default preserves
# the behaviour this role had when type was hardcoded.
#
# receiveonly is the safe setting for a machine you are still evaluating:
# Syncthing propagates deletions, so a misconfigured sendreceive host can
# delete data on every peer. A receiveonly host accepts changes and never
# sends its own.
syncthing_folder_type: sendreceive

# Optional per-folder override on this host, for the case where one folder
# needs a different type from the rest:
#   syncthing_folder_types:
#     web: receiveonly
syncthing_folder_types: {}

# Devices that are not Ansible hosts (phones, a laptop): each is added to every
# syncthing_mesh host's device list, and to the share list of each folder it
# names. Folder share lists are set exactly -- mesh peers plus these -- so a
# device shared by hand in the GUI is removed on the next run; declare it here.
# Device IDs are not secret, but they identify a device: keep the real list in
# your untracked vars file, not in this repo.
#   syncthing_extra_devices:
#     - name: phone
#       id: XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX-XXXXXXX
#       folders: [docs]
syncthing_extra_devices: []

# Per host, in the inventory -- no default, and required for every member of
# syncthing_mesh. The device ID this host must present (`syncthing
# --device-id`); pinning it is the trust decision, and a run fails if the live
# ID differs. See README "Pairing".
#   newbox syncthing_pinned_device_id=XXXXXXX-XXXXXXX-...
#
# Optional per host: the name peers give this device when they add it.
# Defaults to the inventory hostname (set it where that is "localhost").
#   localhost syncthing_device_name=puffin

