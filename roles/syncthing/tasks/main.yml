---
# Install Syncthing, prepare the folders in syncthing_folders, and reconcile
# each syncthing_mesh host's devices and folder shares to the declared state
# (see roles/syncthing/README.md).
#
# Trust model: a device ID is the SHA-256 fingerprint of that device's TLS
# certificate, so accepting a device means deciding "this ID is that
# machine". Here that decision is made once, by pinning each mesh host's ID
# in the inventory (syncthing_pinned_device_id) and each extra device's ID
# in syncthing_extra_devices. Every run checks the host's live ID against
# its pin and fails on a mismatch (reinstall, cloned disk, new certificate)
# rather than trusting a new identity. Nothing is ever accepted from the
# pending lists -- they are reported, because anything there is undeclared.
#
# A host outside syncthing_mesh only gets Syncthing installed and running:
# no devices are added and no folders shared until it joins the group.
#
# NOTE: verify the signing-key URL and repo details against
# https://apt.syncthing.net/ at deploy time — apt-repo setup instructions can
# change and this hasn't been exercised against real infrastructure yet.

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add the Syncthing apt signing key
  ansible.builtin.get_url:
    url: https://syncthing.net/release-key.gpg
    dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    mode: "0644"
  become: true

- name: Add the Syncthing apt repository (deb822 format)
  ansible.builtin.deb822_repository:
    name: syncthing-stable
    types: deb
    uris: https://apt.syncthing.net/
    suites: syncthing
    components: stable
    signed_by: /etc/apt/keyrings/syncthing-archive-keyring.gpg
  become: true
  register: syncthing_repo

- name: Update apt cache after adding the repo
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: syncthing_repo.changed

- name: Install syncthing
  ansible.builtin.apt:
    name: syncthing
    state: present
  become: true

- name: Validate the requested Syncthing folder types
  ansible.builtin.assert:
    that:
      - _syncthing_requested_types | difference(syncthing_folder_types_valid) | length == 0
    fail_msg: >-
      Invalid Syncthing folder type(s):
      {{ _syncthing_requested_types | difference(syncthing_folder_types_valid) | join(', ') }}.
      Valid values are {{ syncthing_folder_types_valid | join(', ') }}.
    quiet: true
  vars:
    _syncthing_requested_types: >-
      {{ ([syncthing_folder_type] + (syncthing_folder_types.values() | list)) | unique }}

# Before anything touches the REST API, so a typo fails the play instead of
# half-applying. Device IDs are eight dash-separated groups of seven base32
# characters.
- name: Validate syncthing_extra_devices
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.id is defined
      - item.id is match('^[A-Z2-7]{7}(-[A-Z2-7]{7}){7}$')
      - item.folders is defined
      - item.folders is sequence
      - item.folders is not string
      - item.folders | length > 0
      - item.folders | difference(syncthing_folders) | length == 0
    fail_msg: >-
      syncthing_extra_devices entry {{ item.name | default('(unnamed)') }} needs a
      name, a full device ID (XXXXXXX-XXXXXXX-... uppercase, eight groups), and a
      non-empty folders list drawn from syncthing_folders
      ({{ syncthing_folders | join(', ') }}).
    quiet: true
  loop: "{{ syncthing_extra_devices }}"
  loop_control:
    label: "{{ item.name | default('(unnamed)') }}"

- name: Validate the pinned device IDs of every mesh host
  ansible.builtin.assert:
    that:
      - hostvars[item].syncthing_pinned_device_id is defined
      - hostvars[item].syncthing_pinned_device_id is match('^[A-Z2-7]{7}(-[A-Z2-7]{7}){7}$')
    fail_msg: >-
      {{ item }} is in syncthing_mesh but has no valid syncthing_pinned_device_id.
      Read it on that host with `syncthing --device-id` (v1) or
      `syncthing device-id` (v2) and set it on the host's inventory line.
    quiet: true
  loop: "{{ groups.get('syncthing_mesh', []) }}"
  when: syncthing_in_mesh | bool

- name: Ensure managed folders exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ syncthing_folders }}"

- name: Enable and start the per-user Syncthing service
  ansible.builtin.systemd_service:
    name: "syncthing@{{ ansible_facts.user_id }}.service"
    enabled: true
    state: started
  become: true

# Everything from here down talks to the local Syncthing REST API, which
# ansible.builtin.uri (even plain GETs) and the API-key command both skip
# under --check — same blind spot as restic's `restic init`, just a
# different flavor. Guarded as a block rather than piecemeal: none of this
# is meaningfully previewable in a dry run anyway.
- name: Read the local Syncthing API key
  ansible.builtin.command: >-
    grep -oP '(?<=<apikey>)[^<]+'
    {{ ansible_facts.env.HOME }}/.local/state/syncthing/config.xml
  register: syncthing_apikey_result
  changed_when: false
  when: not ansible_check_mode

- name: Set the API key fact
  ansible.builtin.set_fact:
    syncthing_apikey: "{{ syncthing_apikey_result.stdout }}"
  when: not ansible_check_mode

- name: Query this host's Syncthing device ID
  ansible.builtin.uri:
    url: http://127.0.0.1:8384/rest/system/status
    headers:
      X-API-Key: "{{ syncthing_apikey }}"
    return_content: true
  register: syncthing_status
  changed_when: false
  when: not ansible_check_mode

- name: Set the device ID fact
  ansible.builtin.set_fact:
    syncthing_device_id: "{{ syncthing_status.json.myID }}"
  when: not ansible_check_mode

- name: Verify this host's live device ID matches its pin
  ansible.builtin.assert:
    that:
      - syncthing_device_id == syncthing_pinned_device_id
    fail_msg: >-
      This host's Syncthing device ID is {{ syncthing_device_id }}, but its
      inventory pins {{ syncthing_pinned_device_id }}. A reinstall or a new
      certificate changes the ID; if that is expected, update the pin --
      that edit is the trust decision.
    quiet: true
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

# Peers come from the inventory pins, not from runtime facts, so a --limit
# run no longer fails on missing hostvars. Both sides of a pair still need a
# run to converge, so run the whole group.
- name: Declare mesh peers
  ansible.builtin.set_fact:
    syncthing_declared_devices: >-
      {{ (syncthing_declared_devices | default([]))
         + [{'deviceID': hostvars[item].syncthing_pinned_device_id,
             'name': hostvars[item].syncthing_device_name | default(item)}] }}
    syncthing_peer_devices: >-
      {{ (syncthing_peer_devices | default([]))
         + [{'deviceID': hostvars[item].syncthing_pinned_device_id}] }}
  loop: "{{ syncthing_peer_hosts }}"
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

- name: Declare extra devices
  ansible.builtin.set_fact:
    syncthing_declared_devices: >-
      {{ (syncthing_declared_devices | default([]))
         + [{'deviceID': item.id, 'name': item.name}] }}
  loop: "{{ syncthing_extra_devices }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

- name: Read this host's Syncthing device list
  ansible.builtin.uri:
    url: http://127.0.0.1:8384/rest/config/devices
    headers:
      X-API-Key: "{{ syncthing_apikey }}"
    return_content: true
  register: syncthing_known_devices
  changed_when: false
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

# This is the pairing: the ID was accepted when it was pinned, so no GUI
# confirmation is needed on either side. An existing entry keeps its name
# (renames in the GUI survive); only the trust flags are enforced below.
- name: Add declared devices this host doesn't know yet
  ansible.builtin.uri:
    url: http://127.0.0.1:8384/rest/config/devices
    method: POST
    headers:
      X-API-Key: "{{ syncthing_apikey }}"
    body_format: json
    body:
      deviceID: "{{ item.deviceID }}"
      name: "{{ item.name }}"
      addresses: [dynamic]
      introducer: false
      autoAcceptFolders: false
    status_code: [200]
  changed_when: true
  loop: >-
    {{ syncthing_declared_devices | default([])
       | rejectattr('deviceID', 'in', syncthing_known_devices.json | map(attribute='deviceID') | list)
       | list }}
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

# Introduction and auto-accept are second, implicit trust paths: an
# introducer adds devices on our behalf, and auto-accept takes any folder a
# device offers. With every device and share declared, both are redundant.
- name: Turn off introducer and auto-accept on declared devices
  ansible.builtin.uri:
    url: "http://127.0.0.1:8384/rest/config/devices/{{ item.deviceID }}"
    method: PATCH
    headers:
      X-API-Key: "{{ syncthing_apikey }}"
    body_format: json
    body:
      introducer: false
      autoAcceptFolders: false
    status_code: [200]
  changed_when: true
  loop: >-
    {{ ((_declared | selectattr('introducer') | list)
        + (_declared | selectattr('autoAcceptFolders') | list)) | unique }}
  loop_control:
    label: "{{ item.name }}"
  vars:
    _declared: >-
      {{ syncthing_known_devices.json
         | selectattr('deviceID', 'in', syncthing_declared_devices | default([]) | map(attribute='deviceID') | list)
         | list }}
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

- name: Build each folder's extra-device share list
  ansible.builtin.set_fact:
    syncthing_extra_shares: >-
      {{ syncthing_extra_shares | default({})
         | combine({item.1: (syncthing_extra_shares | default({})).get(item.1, [])
                            + [{'deviceID': item.0.id}]}) }}
  loop: "{{ syncthing_extra_devices | subelements('folders') }}"
  loop_control:
    label: "{{ item.0.name }} -> {{ item.1 }}"
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

# PUT replaces the whole folder object, so each managed folder's share list is
# set exactly: mesh peers plus the extra devices that name it. Anything shared
# by hand in the GUI is removed -- declare it in syncthing_extra_devices.
# Because both sides of each pair get the folder in the same run, no folder
# offers are generated for anyone to accept.
- name: Share folders with every other mesh member and declared extra device
  ansible.builtin.uri:
    url: "http://127.0.0.1:8384/rest/config/folders/{{ item }}"
    method: PUT
    headers:
      X-API-Key: "{{ syncthing_apikey }}"
    body_format: json
    body:
      id: "{{ item }}"
      label: "{{ item }}"
      path: "{{ ansible_facts.env.HOME }}/{{ item }}"
      type: "{{ syncthing_folder_types[item] | default(syncthing_folder_type) }}"
      devices: >-
        {{ (syncthing_peer_devices | default([]))
           + (syncthing_extra_shares | default({})).get(item, []) }}
    status_code: [200, 201]
  loop: "{{ syncthing_folders }}"
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

# Never accepted, only reported: anything here is a device or folder offer
# that nobody declared.
- name: Read pending devices and folder offers
  ansible.builtin.uri:
    url: "http://127.0.0.1:8384/rest/cluster/pending/{{ item }}"
    headers:
      X-API-Key: "{{ syncthing_apikey }}"
    return_content: true
  register: syncthing_pending
  changed_when: false
  loop: [devices, folders]
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool

- name: Report undeclared devices and pending offers
  ansible.builtin.debug:
    msg:
      - "Configured but undeclared devices (remove in the GUI if gone): {{ _undeclared }}"
      - "Pending devices (not accepted): {{ syncthing_pending.results[0].json | default({}) | dict2items | map(attribute='value.name') | list }}"
      - "Pending folder offers (not accepted): {{ syncthing_pending.results[1].json | default({}) | list }}"
  vars:
    _undeclared: >-
      {{ syncthing_known_devices.json
         | rejectattr('deviceID', 'in', (syncthing_declared_devices | default([]) | map(attribute='deviceID') | list) + [syncthing_device_id])
         | map(attribute='name') | list }}
  when:
    - not ansible_check_mode
    - syncthing_in_mesh | bool
    - _undeclared | length > 0
      or syncthing_pending.results[0].json | default({}) | length > 0
      or syncthing_pending.results[1].json | default({}) | length > 0

- name: Note what is left manual
  ansible.builtin.debug:
    msg: >-
      {% if syncthing_in_mesh | bool %}
      Syncthing devices and folder shares reconciled for {{ ansible_facts.user_id }}.
      Extra devices (phones, laptops) still accept each host once on their side.
      {% else %}
      Syncthing is installed and running, but {{ inventory_hostname }} is not in
      syncthing_mesh, so nothing was paired or shared. Pin its device ID
      (`syncthing --device-id`) in the inventory and add it to the group.
      {% endif %}
