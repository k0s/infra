---
- name: Require navidrome_user
  ansible.builtin.assert:
    that: navidrome_user is defined
    fail_msg: "navidrome_user is undefined; set it in the untracked vars file"

- name: Install Navidrome's companion packages
  become: true
  ansible.builtin.apt:
    name: "{{ navidrome_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check for the pinned Navidrome binary
  ansible.builtin.stat:
    path: "{{ navidrome_install_dir }}/navidrome"
  register: navidrome_binary

# Downloads, so skipped under --check; a dry run on a new host shows it skipped.
- name: Install the pinned Navidrome release
  when:
    - not navidrome_binary.stat.exists
    - not ansible_check_mode
  become: true
  block:
    - name: Create the install directory
      ansible.builtin.file:
        path: "{{ navidrome_install_dir }}"
        state: directory
        mode: "0755"

    - name: Download Navidrome (pinned, checksum-verified)
      ansible.builtin.get_url:
        url: "https://github.com/navidrome/navidrome/releases/download/v{{ navidrome_version }}/navidrome_{{ navidrome_version }}_linux_amd64.tar.gz"
        dest: "{{ navidrome_install_dir }}/navidrome.tar.gz"
        checksum: "sha256:{{ navidrome_sha256 }}"
        mode: "0644"

    - name: Unpack Navidrome
      ansible.builtin.unarchive:
        src: "{{ navidrome_install_dir }}/navidrome.tar.gz"
        dest: "{{ navidrome_install_dir }}"
        remote_src: true
      notify: Reload systemd and restart Navidrome

- name: Install the Navidrome unit
  become: true
  ansible.builtin.template:
    src: navidrome.service.j2
    dest: /etc/systemd/system/navidrome.service
    mode: "0644"
  notify: Reload systemd and restart Navidrome

- name: Enable and start Navidrome
  become: true
  ansible.builtin.systemd_service:
    name: navidrome
    enabled: true
    state: started
    daemon_reload: true
