---
# highstate.yml — apply the full k0s.org host configuration.
#
# ALWAYS review a dry run before applying anything:
#   ansible-playbook -i localhost.ini highstate.yml --check --diff
#
# Then apply for real. Root actions are never unattended: every role that
# needs `become` prompts interactively — there is no stored become secret.
#   ansible-playbook -i localhost.ini highstate.yml --ask-become-pass
#
# Select a subset with --tags (e.g. a fresh box that isn't the server yet):
#   ansible-playbook -i localhost.ini highstate.yml --tags syncthing,links --ask-become-pass
#
# Tags:
#   restic          - versioned local + off-site backup (server role)
#   forge            - GNOME tiling extension (desktop role)
#   k0sngin_service  - k0sNgin systemd service + website hosting (server role)
#   links            - website content symlinks (server role)
#   syncthing        - install, enable, and share folders (any role) — see
#                      Caveat below on running against the whole mesh
#
# syncthing shares folders with every other host in the syncthing_mesh
# inventory group (see ~/web/k0s-infra-hosts.ini.example), via cross-host
# hostvars — run against the whole group in one invocation, not --limit to a
# single host, e.g.:
#   ansible-playbook -i inventory.ini -i ~/web/k0s-infra-hosts.ini highstate.yml \
#     --limit syncthing_mesh --tags syncthing --ask-become-pass
#
# `--check` can't see through raw `command`/`shell` tasks (a few exist here —
# forge's build steps, restic's `restic init`) or predict some
# conditional-on-registered-result tasks. Read the task names in the diff
# output, not just the summary counts, for those.
#
# `--check` also can't chain a hypothetical change into a later task's real
# system query: on a from-scratch dry run, syncthing's "install the package"
# step reports (hypothetical) changed, but the *next* task really queries
# systemd for the package's syncthing@.service unit — which genuinely
# doesn't exist yet, since check mode never actually installed anything.
# That surfaces as a real ERROR on a totally clean first dry run (confirmed
# 2026-08-23) even though a real (non-check) apply installs the package
# first and then succeeds. Don't be alarmed by it on a brand-new host.
#
# Personal/topology values (directory layout, peer hostnames) are NOT tracked
# in this public repo — they're read from ~/web/k0s-infra-vars.yml on the
# target host. Copy k0s-infra-vars.yml.example there and fill it in before
# running this. Missing the file fails fast with a clear undefined-variable
# error, which is intentional.

- name: Apply full k0s.org host state
  hosts: all
  # NOTE: uses lookup('env', 'HOME'), not ansible_facts.env.HOME like
  # everywhere else in this repo, deliberately — vars_files paths are
  # resolved before "Gathering Facts" runs, so a fact isn't available yet
  # at this exact point. lookup('env', ...) reads the control node's own
  # environment immediately, with no such ordering dependency. Found
  # 2026-08-23 via a real [WARNING]: skipping vars_file item due to an
  # undefined variable on the first real run.
  vars_files:
    - "{{ lookup('env', 'HOME') }}/web/k0s-infra-vars.yml"
  roles:
    - role: restic
      tags: [restic]
    - role: forge
      tags: [forge]
    - role: k0sngin_service
      tags: [k0sngin_service]
    - role: links
      tags: [links]
    - role: syncthing
      tags: [syncthing]
